<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2EE Web Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="app-container">
        <!-- Authentication Section -->
        <div id="auth-container">
            <div id="register-form">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button id="register-button">Register</button>
                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
            <div id="login-form" style="display: none;">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <label for="login-key-file" class="file-input-label">Upload Your Private Key:</label>
                <input type="file" id="login-key-file" accept=".json" required>
                <button id="login-button">Login</button>
                <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
            </div>
        </div>

        <!-- Main Chat Section (hidden by default) -->
        <div id="chat-container" style="display: none;">
            <div id="sidebar">
                <h3>Users</h3>
                <ul id="user-list">
                    <!-- User list will be populated by JS -->
                </ul>
                <div id="user-info">
                    Logged in as: <strong id="current-username"></strong>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
            <div id="main-chat">
                <div id="chat-window">
                    <div id="messages">
                        <!-- Messages will be populated by JS -->
                        <p class="system-message">Select a user to start chatting.</p>
                    </div>
                </div>
                <div id="message-input-area">
                    <input type="text" id="message-input" placeholder="Type your message..." disabled>
                    <button id="send-button" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript files -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='crypto.js') }}"></script>
    <script src="{{ url_for('static',filename='main.js') }}"></script>
</body>
</html>
